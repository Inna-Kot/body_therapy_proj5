{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="overlay"></div>

<div class="container pt-5 pb-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 bg-white p-5 rounded shadow-lg text-center" style="opacity: 0.95;">
            <h2 class="mb-4 font-weight-bold text-danger text-uppercase">Cancel Session</h2>
            <hr>
            
            <p class="lead">Are you sure you want to cancel your booking for <strong>{{ booking.service.name }}</strong>?</p>
            <p class="text-muted mb-4">
                Date: {{ booking.booking_date|date:"D, d M Y" }}<br>
                Time: {{ booking.time_slot|time:"H:i" }}
            </p>

            <form method="POST" action="{% url 'cancel_booking' booking.id %}">
                {% csrf_token %}
                <div class="mt-4">
                    <a href="{% url 'my_account' %}" class="btn btn-outline-dark rounded-0 px-4 py-2 mr-2">No, Keep it</a>
                    <button type="submit" class="btn btn-danger rounded-0 px-4 py-2">Yes, Cancel it</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
