{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}
<div class="overlay"></div>

<div class="container pt-5 pb-5">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-8 col-lg-6 bg-white p-5 rounded shadow-lg" style="opacity: 0.95;">
            
            <h2 class="mb-3 font-weight-bold text-center text-uppercase">{% trans "Sign Up" %}</h2>
            <hr>

            <p class="text-center text-muted mb-4">
                {% blocktranslate %}Already have an account? Then please <a href="{{ login_url }}" class="font-weight-bold text-navy">sign in</a>.{% endblocktranslate %}
            </p>

            <form class="signup" id="signup_form" method="POST" action="{% url 'account_signup' %}">
                {% csrf_token %}
                
                {{ form|crispy }}
                
                {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                {% endif %}
                
                <div class="text-center mt-4">
                    <button class="btn btn-dark text-white rounded-0 text-uppercase px-5 py-3 font-weight-bold w-100" type="submit">
                        {% trans "Sign Up" %}
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
