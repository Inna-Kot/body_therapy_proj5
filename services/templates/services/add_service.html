{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block page_header %}
    <div class="container header-container" style="padding-top: 160px;">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6">
                <hr>
                <h2 class="logo-font mb-4">Service Management</h2>
                <h3 class="text-muted">Add a Service</h3>
                <hr>
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6">
                <form method="POST" action="{% url 'add_service' %}" class="form mb-2" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="text-right mt-3 mb-5">
                        <a class="btn btn-outline-dark rounded-0" href="{% url 'home' %}">Cancel</a>
                        <button class="btn btn-dark rounded-0" type="submit">Add Service</button>
                    </div>
                </form>
            </div>            
        </div>
    </div>
{% endblock %}
